# Central configuration. Every script reads its settings from here,
# so an experiment can be repeated by keeping this file and the seed the same.
# Paths are relative to the project root.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures

files:
  transaction: train_transaction.csv
  identity: train_identity.csv
  merged: train_merged.parquet    # written to interim_dir by src/data/make_dataset.py
  blocked: train_blocked.parquet  # merged table + day and block columns, incomplete last block dropped
  # Written to processed_dir by src/features/build_features.py (stage 2):
  train_features: train_features.parquet    # training rows: blocks 1-3 minus the gap days
  tune_features: tune_features.parquet      # block 4, Milestone 2 validation
  preprocess_state: preprocess_state.json   # dropped columns, frequency tables and feature list, fitted on the training rows

# Time split (src/data/split.py). Blocks are numbered from 1.
split:
  block_days: 30            # length of one block in days
  gap_days: 7               # label delay: training rows end this many days before an evaluation window
  train_blocks: [1, 2, 3]
  tune_blocks: [4]          # Milestone 2 validation. Blocks 5-6 are the final test, used only in Milestone 3.

# Preprocessing (src/features/preprocess.py), fitted on training rows only.
preprocess:
  max_missing: 0.95         # drop a column when MORE than this share of its training values is missing (EDA decision P3)

# Logistic regression baseline (src/models/baseline.py), fitted on training rows only.
baseline:
  max_onehot_levels: 10     # one-hot a text column only if it has at most this many distinct training values (missing counts as one); others keep only their _freq column
  C: 1.0                    # inverse strength of the L2 penalty (scikit-learn's default); not tuned in M2, so block 4 stays unseen by both models (as in D2)
  solver: newton-cholesky   # Newton's method on the full curvature matrix; suits many more rows (294k) than inputs (842). lbfgs did not converge in 1000 iterations on the real training rows
  max_iter: 100             # iteration limit (scikit-learn's default); newton-cholesky needed 8 on the real training rows

# Evaluation (src/evaluation/), from the PDD.
evaluation:
  budgets: [30, 60, 100, 150]   # daily alert budgets k: how many alerts the analyst team can review per day
  review_cost: 5                # cost of reviewing one alert, in dollars like TransactionAmt (D6). Swept in Milestone 3.
