# Central configuration. Every script reads its settings from here,
# so an experiment can be repeated by keeping this file and the seed the same.
# Paths are relative to the project root.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures

files:
  transaction: train_transaction.csv
  identity: train_identity.csv
